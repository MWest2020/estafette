name: validate-catalog

# PR gate for catalogue submissions: every catalog/*.yaml must validate against
# the PoCEntry schema. Review is the only human gate; this makes the machine gate
# actionable — it fails naming the first invalid file and reason.
on:
  pull_request:
    paths:
      - "catalog/**"
      - "src/estafette/entry.py"
      - ".github/workflows/validate-catalog.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Validate catalog entries
        run: |
          uv sync --dev
          uv run estafette catalogue --check --catalog catalog
